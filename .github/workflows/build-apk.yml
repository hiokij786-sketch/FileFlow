name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version
          VERSION_LINE=$(java -version 2>&1 | head -n 1 || true)
          RAW_VERSION=$(echo "$VERSION_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect active Java version from: $VERSION_LINE"
            exit 1
          fi
          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION=$(echo "$RAW_VERSION" | cut -d'.' -f2)
          else
            MAJOR_VERSION=$(echo "$RAW_VERSION" | cut -d'.' -f1 | cut -d'-' -f1)
          fi
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from: $RAW_VERSION"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found at $KEYTOOL_BIN"
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Temporary debug keystore was not created at $KEYSTORE_PATH"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK at $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)."

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified APK missing at $SOURCE_APK"
            exit 1
          fi
          RAW_REPO="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO=$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          RELEASE_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-asset-XXXXXX")
          ASSET_FILENAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed at $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is missing or invalid: ${ASSET_PATH:-unset}"
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          printf -v RELEASE_NOTES '%s\n\n%s\n%s\n%s\n%s\n\n%s' \
            "Automatically generated debug APK built by GitHub Actions." \
            "- **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}" \
            "- **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${GITHUB_SHA}" \
            "- **Asset:** ${ASSET_NAME}" \
            "> **Testing Notice:** This APK is intended for testing only. It is **not** a Google Play Store production release and is signed only with a temporary debug keystore."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            {
              echo "### Debug APK Build & Release Summary"
              echo ""
              echo "- **Status:** APK build, artifact upload, and GitHub Release publishing succeeded."
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Direct GitHub Release URL:** $RELEASE_URL"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo "- **Download Instructions:** Download \`$ASSET_NAME\` directly from the **Assets** section on the GitHub Release page."
              echo "- **Backup Artifact:** The GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$UPLOAD_OUTCOME" = "success" ]; then
              echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
              {
                echo "### Debug APK Build & Release Summary"
                echo ""
                echo "> **Warning:** Publishing to GitHub Releases failed. However, the debug APK build succeeded and your APK was preserved."
                echo ""
                echo "- **APK Build Status:** Succeeded"
                echo "- **GitHub Actions Artifact:** \`app-debug-apk\` remains available for download from this workflow run's Artifacts section."
                echo "- **GitHub Release Status:** Failed (see the \`Publish APK to GitHub Releases\` step logs for details)."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::APK build or artifact upload did not succeed (upload outcome: $UPLOAD_OUTCOME, release outcome: $PUBLISH_OUTCOME)."
              exit 1
            fi
          fi
